name: Try container
on:
  push:
    branches: [main, feat/primaryserver-sqlite-migration]
    paths:
      - apps/try/**
      - src/components/try/**
      - src/components/theme-provider.tsx
      - src/lib/web-transfer/**
      - src/lib/utils.ts
      - messages/**
      - public/tailcat/**
      - .github/workflows/try-container.yml
      - .github/actions/deploy/**
      - deploy/automation/**
      - e2e/deployment/**
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: try-container-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      image: ${{ steps.image.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish independent transfer application
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/try/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/uniclipboard/uc-try:${{ github.sha }}
          build-args: |
            SOURCE_REVISION=${{ github.sha }}
            NEXT_PUBLIC_TRY_SHORT_CODE=1
            NEXT_PUBLIC_TRY_RENDEZVOUS_URL=https://rendezvous.uniclipboard.app
          cache-from: type=gha,scope=try
          cache-to: type=gha,mode=max,scope=try
      - name: Verify production image through HTTP
        env:
          TRY_IMAGE: ghcr.io/uniclipboard/uc-try@${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          trap 'status=$?; if [ "$status" -ne 0 ]; then docker logs try-migration-e2e || true; fi; exit "$status"' EXIT
          docker pull "$TRY_IMAGE"
          docker run -d --name try-migration-e2e -p 127.0.0.1:3321:3000 "$TRY_IMAGE"
          for _attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3321/api/health/live >/dev/null; then break; fi
            sleep 1
          done
          node apps/try/e2e/http.mjs
          docker restart try-migration-e2e
          for _attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3321/api/health/live >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3321/api/health/live
      - name: Verify deployment and rollback with disposable Docker projects
        env:
          TRY_IMAGE: ghcr.io/uniclipboard/uc-try@${{ steps.image.outputs.digest }}
        run: sudo python3 e2e/deployment/http.py --app try --try-image "$TRY_IMAGE" --try-source "$GITHUB_SHA"
      - name: Save deployment acceptance receipt
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: try-deployment-e2e
          path: .migration/receipts/deployment.json
          if-no-files-found: ignore
      - name: Record immutable source and image identity
        env:
          SOURCE_REVISION: ${{ github.sha }}
          TRY_IMAGE: ghcr.io/uniclipboard/uc-try@${{ steps.image.outputs.digest }}
        run: |
          node --input-type=module - <<'JS'
          import {writeFileSync} from 'node:fs';
          writeFileSync('.migration/try/image.json',JSON.stringify({source:process.env.SOURCE_REVISION,image:process.env.TRY_IMAGE,buildConfig:{NEXT_PUBLIC_TRY_SHORT_CODE:'1',NEXT_PUBLIC_TRY_RENDEZVOUS_URL:'https://rendezvous.uniclipboard.app'}},null,2)+'\n');
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: try-container-acceptance
          path: .migration/try/*.json
          if-no-files-found: ignore

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: production-try
      url: https://try.uniclipboard.app
    concurrency:
      group: production-try
      cancel-in-progress: false
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/deploy
        with:
          app: try
          source: ${{ github.sha }}
          images: '{"try":"ghcr.io/uniclipboard/uc-try@${{ needs.build.outputs.image }}"}'
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          target: ${{ secrets.DEPLOY_TARGET }}
          port: ${{ secrets.DEPLOY_PORT }}
          known-hosts: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: try-production-deployment
          path: .deployment/*.json
          if-no-files-found: ignore
