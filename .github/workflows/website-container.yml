name: Website container
on:
  push:
    branches: [main, feat/primaryserver-sqlite-migration]
    paths-ignore: ["apps/try/**", "docs/**", ".planning/**"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: website-container-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Download the public build snapshot
        env:
          BUILD_KEY: ${{ secrets.WEBSITE_BUILD_SSH_KEY }}
          BUILD_TARGET: ${{ secrets.WEBSITE_BUILD_TARGET }}
          BUILD_PORT: ${{ secrets.WEBSITE_BUILD_PORT }}
          BUILD_HOSTS: ${{ secrets.WEBSITE_BUILD_KNOWN_HOSTS }}
          BUILD_ENV: ${{ secrets.WEBSITE_BUILD_ENV }}
        run: |
          set -euo pipefail
          install -d -m 700 .build-inputs
          printf '%s\n' "$BUILD_KEY" > .build-inputs/key
          printf '%s\n' "$BUILD_HOSTS" > .build-inputs/known_hosts
          printf '%s\n' "$BUILD_ENV" > .build-inputs/build.env
          chmod 600 .build-inputs/*
          ssh -i .build-inputs/key -p "$BUILD_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=.build-inputs/known_hosts "$BUILD_TARGET" > .build-inputs/public.sqlite
          test -s .build-inputs/public.sqlite
          gzip -c .build-inputs/public.sqlite > .build-inputs/public.sqlite.gz
          digest=$(cat .build-inputs/public.sqlite .build-inputs/build.env | sha256sum | cut -d ' ' -f 1)
          echo "BUILD_INPUT_DIGEST=$digest" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish website
        id: website
        uses: docker/build-push-action@v6
        with:
          context: .
          target: website
          platforms: linux/amd64
          push: true
          tags: ghcr.io/uniclipboard/uc-website:${{ github.sha }}
          build-args: |
            SOURCE_REVISION=${{ github.sha }}
            BUILD_INPUT_DIGEST=${{ env.BUILD_INPUT_DIGEST }}
          secret-files: |
            build_db=.build-inputs/public.sqlite.gz
            build_env=.build-inputs/build.env
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build and publish scheduler
        id: scheduler
        uses: docker/build-push-action@v6
        with:
          context: .
          target: scheduler
          platforms: linux/amd64
          push: true
          tags: ghcr.io/uniclipboard/uc-website-scheduler:${{ github.sha }}
          build-args: |
            SOURCE_REVISION=${{ github.sha }}
            BUILD_INPUT_DIGEST=${{ env.BUILD_INPUT_DIGEST }}
          secret-files: |
            build_db=.build-inputs/public.sqlite.gz
            build_env=.build-inputs/build.env
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Validate the production container through HTTP
        env:
          WEBSITE_IMAGE: ghcr.io/uniclipboard/uc-website@${{ steps.website.outputs.digest }}
        run: |
          set -euo pipefail
          docker buildx build --load --target maintenance -t uc-website-maintenance .
          mkdir -p .migration/ci
          chmod 777 .migration/ci
          cp .build-inputs/public.sqlite .migration/ci/website.sqlite
          chmod 666 .migration/ci/website.sqlite
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD/.migration/ci:/fixture" --entrypoint node uc-website-maintenance --import tsx scripts/migration/fixture.ts /fixture/website.sqlite /fixture/fixture.env
          docker run -d --name migration-e2e -p 127.0.0.1:3317:3000 -v "$PWD/.migration/ci:/data" --env-file .build-inputs/build.env -e CRON_SECRET=migration-fixture-secret "$WEBSITE_IMAGE"
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3317/api/health/ready >/dev/null; then break; fi
            sleep 1
          done
          MIGRATION_E2E_URL=http://localhost:3317 node --env-file=.migration/ci/fixture.env e2e/migration/http.mjs
          docker restart migration-e2e
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3317/api/health/ready >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3317/api/health/ready
      - name: Save HTTP acceptance receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: website-http-acceptance
          path: .migration/receipts/http.json
          if-no-files-found: ignore
      - name: Record immutable image identities
        env:
          SOURCE_SHA: ${{ github.sha }}
          WEBSITE_DIGEST: ${{ steps.website.outputs.digest }}
          SCHEDULER_DIGEST: ${{ steps.scheduler.outputs.digest }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          Path('image-receipt.json').write_text(json.dumps({
            'source': os.environ['SOURCE_SHA'],
            'website': 'ghcr.io/uniclipboard/uc-website@' + os.environ['WEBSITE_DIGEST'],
            'scheduler': 'ghcr.io/uniclipboard/uc-website-scheduler@' + os.environ['SCHEDULER_DIGEST'],
          }, indent=2) + '\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: website-image-receipt
          path: image-receipt.json
      - name: Remove temporary build inputs
        if: always()
        run: rm -rf .build-inputs
