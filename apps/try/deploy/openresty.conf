server {
    listen 80;
    listen [::]:80;
    server_name try.uniclipboard.app;
    location ^~ /.well-known/acme-challenge/ {
        root /www/sites/try.uniclipboard.app/acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 308 https://try.uniclipboard.app$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name try.uniclipboard.app;
    ssl_certificate /www/sites/try.uniclipboard.app/ssl/fullchain.pem;
    ssl_certificate_key /www/sites/try.uniclipboard.app/ssl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # The application decompresses this file itself. Serve the original gzip bytes.
    location ~ ^/tailcat/main\.[a-f0-9]+\.wasm\.gz$ {
        root /www/sites/try.uniclipboard.app/assets;
        default_type application/octet-stream;
        gzip off;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Referrer-Policy "no-referrer" always;
    }
    location ^~ /_next/static/ {
        proxy_pass http://127.0.0.1:3321;
        proxy_intercept_errors on;
        error_page 404 = @legacy_try_static;
    }
    location @legacy_try_static {
        root /www/sites/try.uniclipboard.app/legacy-assets;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Referrer-Policy "no-referrer" always;
    }
    location ~ ^/(\.git|\.env)(/|$|\.) { return 404; }
    location / {
        proxy_pass http://127.0.0.1:3321;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 120s;
    }
}
