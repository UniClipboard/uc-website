# Install as a new website virtual host. Do not replace existing virtual hosts.
server {
    listen 80;
    listen [::]:80;
    server_name uniclipboard.app www.uniclipboard.app;
    return 308 https://www.uniclipboard.app$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name uniclipboard.app;
    ssl_certificate /www/sites/www.uniclipboard.app/ssl/fullchain.pem;
    ssl_certificate_key /www/sites/www.uniclipboard.app/ssl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 308 https://www.uniclipboard.app$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.uniclipboard.app;
    ssl_certificate /www/sites/www.uniclipboard.app/ssl/fullchain.pem;
    ssl_certificate_key /www/sites/www.uniclipboard.app/ssl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 12m;

    location ~ ^/(\.git|\.env)(/|$|\.) { return 404; }

    location / {
        proxy_pass http://127.0.0.1:3320;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
